<!-- Pagina inicial publica: apresenta o posto e direciona para servicos e login. -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posto Nova Rota</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsivo.css') }}">
</head>
<body>
    
    <div class="site-shell home-only">
        <!-- Hero da pagina inicial: concentra navegacao, chamada principal e botao para servicos. -->
        <header class="hero full-hero" id="inicio">
            <!-- Menu publico com links gerados pelas rotas Flask via url_for(). -->
            <nav class="site-nav">
                <a class="brand" href="{{ url_for('home') }}" aria-label="Voltar para a página principal">
                    <img src="{{ url_for('static', filename='img/Logo-oficial.png') }}" alt="Posto Nova Rota">
                    <span class="brand-name">Nova Rota</span>
                </a>

                <div class="nav-links" aria-label="Navegação principal">
                    <a href="{{ url_for('servicos') }}">Serviços</a>
                    <a href="{{ url_for('esg') }}">ESG</a>
                    <a href="{{ url_for('sobre') }}">Sobre Nós</a>
                    <a href="{{ url_for('contato') }}">Contato</a>
                </div>

               <div class="nav-actions">
    <a class="btn ghost" href="{{ url_for('login', tipo='funcionario') }}">Login</a>
    <a class="btn primary btn-highlight" href="{{ url_for('login', tipo='cliente') }}">Área do Cliente</a>
</div>
            </nav>

            <!-- Texto principal da home, apresentado sobre a area visual do hero. -->
            <div class="hero-content">
                <div class="hero-copy">
                    <h1>Mais que abastecimento.</h1>
                    <h2>Tecnologia, praticidade e confiança para sua empresa.</h2>
                    <p>O sistema RotaFácil conecta gestão, pagamentos e serviços automotivos em uma única plataforma.</p>
                    <div class="hero-buttons">
                        <a class="btn btn-highlight hero-service-cta" href="{{ url_for('servicos') }}">Conheça nossos serviços</a>
                        </div>
                </div>
            </div>
        </header>
        <!-- Rodape reaproveitado em varias paginas publicas. -->
        {% include '_footer.html' %}
    </div>
</body>
</html>
