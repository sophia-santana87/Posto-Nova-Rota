<!-- Pagina simples exibida quando ocorre um erro tratado pela aplicacao. -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Posto Nova Rota</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsivo.css') }}">
</head>
<body class="inner-page">
    <!-- Pagina generica para erros 404 e 500 enviados pelo app.py. -->
    <main class="section page-section">
        <section class="about-hero-panel">
            <!-- A variavel erro vem dos handlers not_found() e internal_error(). -->
            <p class="eyebrow">RotaFácil</p>
            <h1>{{ erro }}</h1>
            <p>Volte para a página inicial ou tente acessar novamente em instantes.</p>
            <div class="hero-buttons">
                <a class="btn btn-highlight" href="{{ url_for('home') }}">Voltar ao início</a>
            </div>
        </section>
    </main>
    <!-- Inclui o rodape compartilhado. -->
    {% include '_footer.html' %}
</body>
</html>
